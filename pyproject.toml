[project]
name = "assist"
version = "0.1.0"
description = "Real-time AI prompter for online meetings: live transcription, meeting context and short answers on demand"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "colorama>=0.4.6 ; sys_platform == 'win32'",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
]

[project.scripts]
assist = "assist.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "PT",    # flake8-pytest-style
    "RUF",   # ruff-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
