# Non-secret settings. API keys live in .env (see .env.example).
# Any value can be overridden by an environment variable ASSIST_<SECTION>__<KEY>,
# for example ASSIST_LOG__LEVEL=DEBUG.

[log]
level = "INFO"

[audio]
# Device name or a part of it, as printed by scripts/list_devices.py. Not set: the Windows
# default output (for the loopback) and the default microphone. For the loopback either the
# output device name or its "[Loopback]" name works.
# loopback_device = "Headphones"
# mic_device = "Microphone"
# Frame length in milliseconds: 10, 20 or 30 (the lengths webrtcvad accepts).
frame_ms = 20

# Silence cutting (webrtcvad). Only speech is sent to speech recognition.
# How strictly a frame must sound like speech: 0 (lenient) to 3 (strict).
vad_aggressiveness = 2
# Audio kept from before speech is detected, so the start of the first word is not lost.
pre_speech_ms = 300
# Speech within that window needed to open a phrase: a lone click or knock does not.
min_speech_ms = 60
# Silence still sent after speech stops, so recognition sees the phrase end. Pauses shorter
# than this stay inside the phrase.
hangover_ms = 600

# Meeting context. When the window of recent phrases and answers spans window_seconds, its
# oldest compress_seconds go into the summary. Times are in seconds.
[context]
window_seconds = 300.0
compress_seconds = 120.0
summary_max_words = 300

# Answers. A one-off request lifts the length rule, so it gets a larger token cap. The caps
# include the model's reasoning tokens.
[assistant]
answer_max_tokens = 1024
request_max_tokens = 4096
temperature = 0.3

# Chat models. api_key_env names the key in .env; timeout is in seconds.
[llm.answer]
provider = "openai_compat"
base_url = "https://api.groq.com/openai/v1"
model = "openai/gpt-oss-120b"
api_key_env = "GROQ_API_KEY"
params = { reasoning_effort = "low" }
timeout = 30.0

