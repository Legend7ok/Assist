# Non-secret settings. API keys live in .env (see .env.example).
# Any value can be overridden by an environment variable ASSIST_<SECTION>__<KEY>,
# for example ASSIST_LOG__LEVEL=DEBUG.

[log]
level = "INFO"

# Chat models. api_key_env names the key in .env; timeout is in seconds.
[llm.answer]
provider = "openai_compat"
base_url = "https://api.groq.com/openai/v1"
model = "openai/gpt-oss-120b"
api_key_env = "GROQ_API_KEY"
params = { reasoning_effort = "low" }
timeout = 30.0

